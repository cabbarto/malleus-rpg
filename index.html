<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MALLEUS — Oficio</title>
<style>
  html,body{margin:0;height:100%;background:#050403;overflow:hidden;color:#e8dcc8;font-family:Georgia,serif}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;box-shadow:0 0 0 2px #3a3024,0 0 0 8px #120e0b,0 24px 80px #000}
  canvas{display:block}
  #ui{position:absolute;inset:0;pointer-events:none}
  #ui *{pointer-events:auto}
  #dialog{display:none;position:absolute;left:8%;right:8%;bottom:10%;
    background:#0c0a08f2;border:2px solid #c4a15a;padding:14px 16px;min-height:84px;font-size:16px;line-height:1.45;
    display:none;align-items:flex-start;gap:14px}
  #dialog.show{display:flex}
  #dialog .portrait{width:64px;height:64px;object-fit:cover;object-position:top center;border:1px solid #5a4a32;flex:none;display:none}
  #dialog .portrait.show{display:block}
  #dialog .body{flex:1;min-width:0}
  #dialog .who{color:#c4a15a;letter-spacing:.2em;font-size:11px;margin-bottom:6px}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    text-align:center;background:#050403 center/cover no-repeat;padding:0 28px 32px}
  #overlay.play{display:none}
  #overlay::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#050403 18%,#05040388 52%,transparent)}
  #overlay>*{position:relative}
  #overlay .k{color:#c4a15a;letter-spacing:.36em;font-size:11px}
  #overlay h1{font-size:54px;font-weight:400;letter-spacing:.12em;margin:6px 0 8px}
  #overlay p{color:#9a8b74;max-width:540px;font-style:italic;margin-bottom:16px}
  #overlay button{background:#1a1410;color:#e8dcc8;border:1px solid #5a4a32;padding:10px 22px;font-family:Georgia,serif;font-size:15px;cursor:pointer}
  #overlay button:hover{border-color:#c4a15a;color:#fff}
  #overlay .help{margin-top:10px;font-size:12px;color:#6e6354;line-height:1.5}
</style>
</head>
<body>
<div id="wrap"><div id="frame">
<canvas id="c"></canvas>
<div id="ui">
  <div id="dialog"><img class="portrait" id="dportrait"/><div class="body"><div class="who" id="dwho"></div><div id="dtxt"></div></div></div>
  <div id="overlay">
    <div class="k">ACCIÓN RPG</div>
    <h1>MALLEUS</h1>
    <p>El pueblo no te quiere. El pozo ya habló. Tú eres el martillo.</p>
    <button id="btnGo">Entrar al pueblo</button>
    <div class="help">WASD mover · clic izquierdo martillo · clic derecho objeto<br>rueda cambia objeto · clic cerca habla / abre</div>
  </div>
</div>
</div></div>
<script src="src/game.js"></script>
</body>
</html>
